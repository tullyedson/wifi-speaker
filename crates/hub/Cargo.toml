[package]
name = "smart-speaker-hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
subtle = "2"
url = { version = "2", features = ["serde"] }
hound = "3.5"
whisper-rs = "0.16.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"

[[bin]]
name = "speaker-hub"
path = "src/main.rs"
